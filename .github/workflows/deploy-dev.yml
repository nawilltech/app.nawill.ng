name: Deploy (dev)

# Every push to `dev` (i.e. every PR merge into dev, since direct pushes to dev are
# discouraged by convention — see docs/TECHNICAL.md §8) redeploys the dev environment.
on:
  push:
    branches: [dev]

jobs:
  deploy:
    # `environment: dev` on this caller job is what actually scopes secret access to
    # the "dev" GitHub Environment — `secrets: inherit` only forwards secrets already
    # visible to this job, so a prod-triggered run can never see dev's (or vice versa).
    environment: dev
    uses: ./.github/workflows/_deploy.yml
    with:
      branch: dev
    secrets: inherit
