name: Deploy (dev)

# Every push to `dev` (i.e. every PR merge into dev, since direct pushes to dev are
# discouraged by convention — see docs/TECHNICAL.md §8) redeploys the dev environment.
on:
  push:
    branches: [dev]

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment_name: dev
      branch: dev
    # `_deploy.yml`'s job sets `environment: dev`, so its `secrets.*` resolve from the
    # "dev" GitHub Environment directly — this just needs to satisfy the required-secret
    # contract, not supply the real values.
    secrets: inherit
