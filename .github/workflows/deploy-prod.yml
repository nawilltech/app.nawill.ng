name: Deploy (prod)

# Only a merged PR into `main` triggers this — main only accepts changes via PR from
# dev (or a hotfix branch), enforced by branch protection, not by this workflow.
# See docs/TECHNICAL.md §8.
on:
  push:
    branches: [main]

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment_name: prod
      branch: main
    secrets:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      APP_PATH: ${{ secrets.PROD_APP_PATH }}
      API_ENV_FILE: ${{ secrets.PROD_API_ENV_FILE }}
      WEB_ENV_FILE: ${{ secrets.PROD_WEB_ENV_FILE }}
