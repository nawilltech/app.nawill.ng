name: Deploy (prod)

# Only a merged PR into `main` triggers this — main only accepts changes via PR from
# dev (or a hotfix branch), enforced by branch protection, not by this workflow.
# See docs/TECHNICAL.md §8.
on:
  push:
    branches: [main]

jobs:
  deploy:
    # `environment: prod` on this caller job is what actually scopes secret access to
    # the "prod" GitHub Environment — `secrets: inherit` only forwards secrets already
    # visible to this job, so a dev-triggered run can never see prod's (or vice versa).
    environment: prod
    uses: ./.github/workflows/_deploy.yml
    with:
      branch: main
    secrets: inherit
