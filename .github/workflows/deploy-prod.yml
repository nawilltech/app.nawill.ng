name: Deploy (prod)

# Only a merged PR into `main` triggers this — main only accepts changes via PR from
# dev (or a hotfix branch), enforced by branch protection, not by this workflow.
# See docs/TECHNICAL.md §8.
on:
  push:
    branches: [main]

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment_name: prod
      branch: main
    # `_deploy.yml`'s job sets `environment: prod`, so its `secrets.*` resolve from the
    # "prod" GitHub Environment directly — this just needs to satisfy the required-secret
    # contract, not supply the real values.
    secrets: inherit
